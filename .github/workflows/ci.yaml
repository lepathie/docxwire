name: CI Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      pr_title:
        description: "PR title to lint (set by the PR Orchestrator workflow)"
        required: false
        type: string

# One job per make target, all running in parallel — `make ci` is the
# local aggregate of exactly these targets (plus `test`).
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test
        run: make test

  check-specs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check specs
        run: make check-specs

  check-deps:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check deps
        run: make check-deps

  lint-pr-title:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.pr_title != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint pull request title
        env:
          PR_TITLE: ${{ github.event.inputs.pr_title }}
        run: echo "$PR_TITLE" | ./node_modules/.bin/commitlint

  publish-pr-checks:
    needs: [lint, test, check-specs, check-deps, lint-pr-title]
    if: github.event_name == 'workflow_dispatch' && always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Mirror job conclusions as check runs on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          LINT: ${{ needs['lint'].result }}
          TEST: ${{ needs['test'].result }}
          CHECK_SPECS: ${{ needs['check-specs'].result }}
          CHECK_DEPS: ${{ needs['check-deps'].result }}
          LINT_PR_TITLE: ${{ needs['lint-pr-title'].result }}
        run: |
          mirror() {
            name="$1"
            case "$2" in
              success) conclusion="success" ;;
              failure) conclusion="failure" ;;
              cancelled) conclusion="cancelled" ;;
              *) conclusion="skipped" ;;
            esac
            gh api -X POST "repos/$REPO/check-runs" \
              -f "name=$name" \
              -f "head_sha=$HEAD_SHA" \
              -f "status=completed" \
              -f "conclusion=$conclusion" \
              -f "output[title]=$name" \
              -f "output[summary]=Mirrored from the retriggered CI pipeline run"
          }
          mirror "lint" "$LINT"
          mirror "test" "$TEST"
          mirror "check-specs" "$CHECK_SPECS"
          mirror "check-deps" "$CHECK_DEPS"
          mirror "lint-pr-title" "$LINT_PR_TITLE"
