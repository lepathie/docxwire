[project]
name = "docxwire"
version = "0.1.0"
description = "Convert .docx files to clean HTML and publish to Joomla"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Leon Pascal Thierschmidt" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Processing :: Filters",
    "Topic :: Internet :: WWW/HTTP",
]

[dependency-groups]
dev = [
    "ty>=0.0.89",
    "ruff>=0.17.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pymarkdownlnt>=0.9.41",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pymarkdown]
plugins.md013.enabled = false

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
