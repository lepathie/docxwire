name: PR Orchestrator

# Orchestrates pull requests to main:
# - openspec-skills-sync: if the PR leaves the generated OpenSpec skill files
#   (`.agents/skills/**`) stale — e.g. a Renovate bump of
#   `@fission-ai/openspec` — regenerate them and push the fix to the PR branch.
# - Every (non-fork, non-bot) PR run re-triggers the CI pipeline on the
#   (possibly fixed) head via `gh workflow run` — the only way PRs get their
#   checks, since ci.yaml runs on explicit dispatch only.

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

jobs:
  # Skips fork PRs (read-only token) and the bot's own fix pushes
  # (fix-loop guard). In-sync PRs are a cheap no-op: no commit, no push —
  # the retrigger still runs.
  openspec-skills-sync:
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the fix to the PR branch
      actions: write # re-trigger the pipeline via `gh workflow run`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }} # the PR branch, not the merge ref
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate if stale
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$(./node_modules/.bin/openspec update --dry-run --json | jq '[.changes[] | select(.path | startswith("~") | not)] | length')" -gt 0 ]; then
            ./node_modules/.bin/openspec update
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .agents/skills
            git commit -m "chore(openspec): regenerate workflow skills"
            git push
          fi
      - name: Re-trigger CI on the (possibly fixed) head
        env:
          BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yaml --ref "$BRANCH" -f "pr_title=$PR_TITLE"
