[project]
name = "docxwire"
version = "0.1.0"
description = "Convert .docx files to clean HTML and publish to Joomla"
readme = "README.md"
requires-python = ">=3.11.5"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Leon Pascal Thierschmidt" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Processing :: Filters",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "pypandoc-binary>=1.15",
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
build = ["uv>=0.13.4"]

[project.scripts]
docxwire = "docxwire.cli:main"

[dependency-groups]
dev = [
    "ty>=0.0.89",
    "ruff>=0.17.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pymarkdownlnt>=0.9.41",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov-fail-under=100"

[tool.pymarkdown]
extensions.front-matter.enabled = true
plugins.md013.enabled = false
system.exclude_path = ["openspec", ".agents/skills/openspec-*"]

[tool.semantic_release]
branch = "main"
allow_zero_version = true
version_toml = ["pyproject.toml:project.version"]
build_command = """
pip install -e '.[build]'
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
"""

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
